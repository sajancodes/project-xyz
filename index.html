<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Model Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --accent: #3b82f6;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --user: #2563eb;
      --assistant: #374151;
      --border: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; }
    .model-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      min-width: 260px;
    }
    .model-row input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      width: 100%;
      font-size: 13px;
      color: var(--muted);
      padding: 0 18px 8px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.assistant { align-self: flex-start; background: var(--assistant); }
    .msg.system { align-self: center; background: transparent; color: var(--muted); font-style: italic; font-size: 13px; }
    footer {
      padding: 12px 18px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    footer input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .typing { opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <h1>Simple Model Chat</h1>
    <div class="model-row">
      <input id="modelId" type="text" value="Xenova/Qwen1.5-0.5B-Chat" />
      <button id="loadBtn">Load Model</button>
    </div>
  </header>
  <div id="status">Model not loaded. Enter a Transformers.js-compatible model id and click Load Model.</div>
  <div id="chat"></div>
  <footer>
    <input id="prompt" type="text" placeholder="Type a message and press Enter..." disabled />
    <button id="sendBtn" disabled>Send</button>
  </footer>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    // Run fully in the browser; do not try to read local files.
    env.allowLocalModels = false;

    const chat = document.getElementById('chat');
    const status = document.getElementById('status');
    const modelInput = document.getElementById('modelId');
    const loadBtn = document.getElementById('loadBtn');
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');

    let generator = null;
    let loading = false;

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function setStatus(text) {
      status.textContent = text;
    }

    async function loadModel() {
      if (loading) return;
      const modelId = modelInput.value.trim();
      if (!modelId) {
        setStatus('Please enter a model id.');
        return;
      }
      loading = true;
      loadBtn.disabled = true;
      promptInput.disabled = true;
      sendBtn.disabled = true;
      setStatus('Loading model: ' + modelId + ' ... (first load may download weights)');
      try {
        generator = await pipeline('text-generation', modelId, {
          progress_callback: (info) => {
            if (info && info.status) {
              setStatus(info.status + (info.name ? ' - ' + info.name : ''));
            }
          }
        });
        setStatus('Model loaded: ' + modelId);
        addMessage('system', 'Model loaded. You can start chatting.');
        promptInput.disabled = false;
        sendBtn.disabled = false;
        promptInput.focus();
      } catch (err) {
        console.error(err);
        setStatus('Failed to load model: ' + (err && err.message ? err.message : err));
        addMessage('system', 'Load failed. Try a different Transformers.js-compatible model id.');
      } finally {
        loading = false;
        loadBtn.disabled = false;
      }
    }

    async function send() {
      if (!generator) return;
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = '';
      addMessage('user', text);
      const thinking = addMessage('assistant', 'Thinking...');
      thinking.classList.add('typing');
      sendBtn.disabled = true;
      promptInput.disabled = true;
      try {
        const out = await generator(text, {
          max_new_tokens: 200,
          temperature: 0.7,
          do_sample: true,
          return_full_text: false
        });
        thinking.remove();
        let reply = '';
        if (Array.isArray(out) && out.length) {
          reply = out[0].generated_text || '';
        } else if (out && out.generated_text) {
          reply = out.generated_text;
        } else {
          reply = JSON.stringify(out);
        }
        reply = reply.trim();
        if (!reply) reply = '(empty response)';
        addMessage('assistant', reply);
      } catch (err) {
        console.error(err);
        thinking.remove();
        addMessage('assistant', 'Error: ' + (err && err.message ? err.message : err));
      } finally {
        sendBtn.disabled = false;
        promptInput.disabled = false;
        promptInput.focus();
      }
    }

    loadBtn.addEventListener('click', loadModel);
    sendBtn.addEventListener('click', send);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    modelInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loadModel();
      }
    });
  </script>
</body>
</html>
